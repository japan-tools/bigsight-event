name: schedule

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 23 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  execute-python:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run scraper
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python scraper.py

      - name: Commit and push updates
        run: |
          git config user.name "RyuSeiri"
          git config user.email "56245152+RyuSeiri@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "update by github action"
          git push origin HEAD:${GITHUB_REF_NAME}
