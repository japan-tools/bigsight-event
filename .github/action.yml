name: schedule
permissions:
  contents: "write"
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    #- cron: "0 18 * * *"
    - cron: "0 23 * * *"
  push:
    branches:
      - main
jobs:
  excute-python:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      # - name: Install dependencies
      #   run: |
      #     python -m pip install --upgrade pip
      #     pip install -r requirements.txt

      - name: excute python
        run: |
          git config --local user.email "56245152+RyuSeiri@users.noreply.github.com"
          git config --local user.name "RyuSeiri"
          git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase
          python scraper.py
          git add .
          git commit -m "update by github action"
          git push